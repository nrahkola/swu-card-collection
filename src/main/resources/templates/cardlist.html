<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" 
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Unlimited - Cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="py-4">
<div class="container-fluid px-4">

    <!-- Yläpalkki -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary">
        <div>
            <h1 class="text-warning fw-bold m-0">Star Wars Unlimited - Cards</h1>
            <small class="text-secondary">Official Set & Card Catalog</small>
        </div>
        <div class="d-flex align-items-center gap-3">
            <span class="text-light small">
                Logged in as: <strong class="text-info" th:text="${username != null ? username : 'User'}">User</strong>
            </span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-danger btn-sm">Log out</button>
            </form>
        </div>
    </div>

    <!-- Suodatuslaatikko -->
    <div class="card bg-dark text-light border-secondary mb-4">
        <div class="card-body py-3">
            <form method="get" th:action="@{/cards}">
                <div class="row g-3">
                    
                    <!-- Setit -->
                    <div class="col-12 col-lg-5" th:if="${allSets != null}">
                        <span class="text-secondary small fw-bold text-uppercase d-block mb-1">Sets:</span>
                        <div class="d-flex flex-wrap gap-3">
                            <div class="form-check form-check-inline m-0" th:each="s : ${allSets}">
                                <input class="form-check-input" 
                                       type="checkbox" 
                                       name="sets" 
                                       th:id="'set_' + ${s.id}" 
                                       th:value="${s.code}"
                                       th:checked="${selectedSets != null and #lists.contains(selectedSets, s.code)}">
                                <label class="form-check-label small fw-bold text-info" 
                                       th:for="'set_' + ${s.id}" 
                                       th:text="${s.code}">
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Aspektit -->
                    <div class="col-12 col-lg-5 border-start-lg border-secondary" th:if="${allAspects != null}">
                        <span class="text-secondary small fw-bold text-uppercase d-block mb-1">Aspects:</span>
                        <div class="d-flex flex-wrap gap-2">
                            <div class="form-check form-check-inline m-0" th:each="a : ${allAspects}">
                                <input class="form-check-input" 
                                       type="checkbox" 
                                       name="aspects" 
                                       th:id="'aspect_' + ${a.id}" 
                                       th:value="${a.name}"
                                       th:checked="${selectedAspects != null and #lists.contains(selectedAspects, a.name)}">
                                <label class="form-check-label small text-light" 
                                       th:for="'aspect_' + ${a.id}" 
                                       th:text="${a.name}">
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Painikkeet -->
                    <div class="col-12 col-lg-2 d-flex gap-2 justify-content-lg-end align-items-center">
                        <a sec:authorize="hasAuthority('ADMIN')" th:href="@{/add}" class="btn btn-sm btn-success">+ Add</a>
                        <button type="submit" class="btn btn-sm btn-primary px-3">Filter</button>
                        <a th:href="@{/cards}" class="btn btn-sm btn-outline-secondary">Reset</a>
                    </div>

                    <!-- Card Types -->
                    <div class="col-12 border-top border-secondary pt-2 mt-2" th:if="${allTypes != null}">
                        <span class="text-secondary small fw-bold text-uppercase d-block mb-1">Card Types:</span>
                        <div class="d-flex flex-wrap gap-3">
                            <div class="form-check form-check-inline m-0" th:each="t : ${allTypes}">
                                <input class="form-check-input" 
                                       type="checkbox" 
                                       name="types" 
                                       th:id="'type_' + ${t}" 
                                       th:value="${t}"
                                       th:checked="${selectedTypes != null and #lists.contains(selectedTypes, t)}">
                                <label class="form-check-label small text-warning fw-semibold" 
                                       th:for="'type_' + ${t}" 
                                       th:text="${t}">
                                </label>
                            </div>
                        </div>
                    </div>

                </div>
            </form>
        </div>
    </div>

    <!-- Korttitaulukko -->
    <div class="table-responsive">
        <table class="table table-dark table-hover align-middle">
            <thead>
                <tr class="text-secondary small text-uppercase">
                    <th scope="col">Image</th>
                    <th scope="col">#</th>
                    <th scope="col">Name</th>
                    <th scope="col">Set</th>
                    <th scope="col">Aspects</th>
                    <th scope="col">Type</th>
                    <th scope="col">Cost</th>
                    <th scope="col">Power</th>
                    <th scope="col">HP</th>
                    <th scope="col">Rarity</th>
                    <th scope="col">Traits</th>
                    <th sec:authorize="hasAuthority('ADMIN')" scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="card : ${cards}">
                    <td>
                        <div class="card-preview-container" th:if="${card.imageUrl != null}">
                            <img th:src="${card.imageUrl}" alt="Card thumbnail" class="card-thumb" />
                            <img th:src="${card.imageUrl}" alt="Card preview" class="card-large-preview" />
                        </div>
                        <span th:if="${card.imageUrl == null}" class="text-muted small">-</span>
                    </td>
                    <td class="fw-semibold text-secondary" th:text="${card.cardNumber}">001</td>
                    <td class="fw-bold text-light" th:text="${card.name}">Card Name</td>
                    <td>
                        <span class="badge bg-primary text-uppercase" 
                              th:if="${card.expansionSet != null}" 
                              th:text="${card.expansionSet.code}">SOR</span>
                    </td>
                    <td>
                        <span th:each="aspect : ${card.aspects}"
                              th:text="${aspect.name}"
                              th:class="'badge me-1 ' + 
                                (${aspect.name == 'Vigilance'} ? 'badge-vigilance' : 
                                (${aspect.name == 'Command'} ? 'badge-command' : 
                                (${aspect.name == 'Aggression'} ? 'badge-aggression' : 
                                (${aspect.name == 'Cunning'} ? 'badge-cunning' : 
                                (${aspect.name == 'Heroism'} ? 'badge-heroism' : 
                                (${aspect.name == 'Villainy'} ? 'badge-villainy' : 'badge-neutral'))))))">
                        </span>
                        <span th:if="${#lists.isEmpty(card.aspects)}" class="badge badge-neutral">Neutral</span>
                    </td>
                    <td th:text="${card.type}">Unit</td>
                    <td th:text="${card.cost != null ? card.cost : '-'}">-</td>
                    <td th:text="${card.power != null ? card.power : '-'}">-</td>
                    <td th:text="${card.hp != null ? card.hp : '-'}">-</td>
                    <td>
                        <span class="badge bg-dark border border-secondary" th:text="${card.rarity}">Common</span>
                    </td>
                    <td>
                        <span th:each="trait : ${card.traits}" 
                              class="badge rounded-pill bg-info text-dark me-1 small" 
                              th:text="${trait.name}">
                        </span>
                    </td>
                <td sec:authorize="hasAuthority('ADMIN')">
                    <a th:href="@{/edit/{id}(id=${card.id})}" class="btn btn-sm btn-outline-warning">Edit</a>
                    <a th:href="@{/delete/{id}(id=${card.id})}" 
                       class="btn btn-sm btn-outline-danger" 
                       onclick="return confirm('Haluatko varmasti poistaa tämän kortin?');">Delete</a>
                </td>
            </tbody>
        </table>
    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
