<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-dark text-light">
<div class="container py-5" style="max-width: 650px;">
    <div class="card bg-secondary text-light p-4 shadow">
        <h2 class="text-success mb-4">Add New Card</h2>

        <form th:action="@{/save}" th:object="${card}" method="post">
            <div class="mb-3">
                <label class="form-label fw-bold">Card Name</label>
                <input type="text" class="form-control bg-dark text-light border-secondary" th:field="*{name}" required />
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-bold">Card Number (#)</label>
                    <input type="text" class="form-control bg-dark text-light border-secondary" th:field="*{cardNumber}" />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-bold">Type</label>
                    <input type="text" class="form-control bg-dark text-light border-secondary" th:field="*{type}" placeholder="Unit, Event, Leader..." />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-bold">Rarity</label>
                    <select class="form-select bg-dark text-light border-secondary" th:field="*{rarity}">
                        <option value="Common">Common</option>
                        <option value="Uncommon">Uncommon</option>
                        <option value="Rare">Rare</option>
                        <option value="Legendary">Legendary</option>
                        <option value="Special">Special</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-bold">Cost</label>
                    <input type="number" class="form-control bg-dark text-light border-secondary" th:field="*{cost}" />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-bold">Power</label>
                    <input type="number" class="form-control bg-dark text-light border-secondary" th:field="*{power}" />
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-bold">HP</label>
                    <input type="number" class="form-control bg-dark text-light border-secondary" th:field="*{hp}" />
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Expansion Set</label>
                <select class="form-select bg-dark text-light border-secondary" th:field="*{expansionSet}">
                    <option th:each="set : ${allSets}" 
                            th:value="${set.id}" 
                            th:text="${set.name + ' (' + set.code + ')'}">
                    </option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Aspects</label>
                <div class="d-flex flex-wrap gap-3 p-2 bg-dark rounded border border-secondary">
                    <div th:each="aspect : ${allAspects}" class="form-check">
                        <input class="form-check-input" 
                               type="checkbox" 
                               th:field="*{aspects}" 
                               th:value="${aspect.id}" 
                               th:id="${'aspect_' + aspect.id}">
                        <label class="form-check-label text-light" 
                               th:for="${'aspect_' + aspect.id}" 
                               th:text="${aspect.name}">
                        </label>
                    </div>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Traits</label>
                <input type="text" 
                    name="traitNames" 
                    class="form-control bg-dark text-light border-secondary" 
                    placeholder="Esim. Imperial, Trooper, Leader" />
            <div class="form-text text-secondary small">Erottele useampi piirre pilkulla.</div>
        </div>

            <div class="mb-3">
                <label class="form-label fw-bold">Image URL</label>
                <input type="text" class="form-control bg-dark text-light border-secondary" th:field="*{imageUrl}" />
            </div>

            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-success fw-bold">Save Card</button>
                <a th:href="@{/cards}" class="btn btn-outline-light">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
